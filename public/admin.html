<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Administración SRAM</title>

  <link rel="stylesheet" href="styles.css">

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->

  <section class="card" id="loginPanel">

    <h1>Administración SRAM</h1>

    <p class="note">
      Acceso exclusivo para personal autorizado.
    </p>

    <form id="loginForm">

      <label for="email">
        Correo electrónico
      </label>

      <input
        type="email"
        id="email"
        required
        autocomplete="username"
        placeholder="Correo electrónico"
      >

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="Contraseña"
      >

      <button
        class="primary"
        type="submit"
      >
        Iniciar sesión
      </button>

      <p
        id="loginMsg"
        class="status"
      ></p>

    </form>

  </section>


  <!-- PANEL -->

  <section
    class="card"
    id="adminPanel"
    hidden
  >

    <!-- CABECERA -->

    <header
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;
      "
    >

      <div>

        <h1>
          Panel de reportes SRAM
        </h1>

        <p class="note">
          Administración de reportes de sospecha de reacciones adversas a medicamentos.
        </p>

        <p>
          Usuario:
          <strong id="userEmail"></strong>
        </p>

      </div>


      <!-- CERRAR SESIÓN -->

      <button
        id="logout"
        type="button"
        style="
          background:#8b1e1e;
          color:white;
          border:0;
          border-radius:8px;
          padding:12px 20px;
          font-weight:bold;
          cursor:pointer;
        "
      >
        🔒 Cerrar sesión
      </button>

    </header>


    <hr>


    <!-- FILTROS -->

    <h2>
      Buscar reportes
    </h2>


    <div
      style="
        display:grid;
        grid-template-columns:
          minmax(220px,2fr)
          minmax(150px,1fr)
          minmax(150px,1fr)
          minmax(150px,1fr);
        gap:12px;
        margin-bottom:15px;
      "
    >

      <div>

        <label for="search">
          Folio, paciente o medicamento
        </label>

        <input
          type="search"
          id="search"
          placeholder="Buscar..."
        >

      </div>


      <div>

        <label for="severity">
          Gravedad
        </label>

        <select id="severity">

          <option value="">
            Todas
          </option>

        </select>

      </div>


      <div>

        <label for="dateFrom">
          Fecha desde
        </label>

        <input
          type="date"
          id="dateFrom"
        >

      </div>


      <div>

        <label for="dateTo">
          Fecha hasta
        </label>

        <input
          type="date"
          id="dateTo"
        >

      </div>

    </div>


    <!-- BOTONES -->

    <div class="actions">

      <button
        class="primary"
        id="load"
        type="button"
      >
        🔄 Cargar reportes
      </button>


      <button
        class="primary"
        id="searchBtn"
        type="button"
      >
        🔎 Buscar
      </button>


      <button
        class="secondary"
        id="clearFilters"
        type="button"
      >
        Limpiar filtros
      </button>


      <button
        class="secondary"
        id="csv"
        type="button"
      >
        📥 Exportar CSV
      </button>


      <span
        id="msg"
        class="status"
      ></span>

    </div>


    <!-- TABLA -->

    <div style="overflow:auto">

      <table>

        <thead>

          <tr>

            <th>Folio</th>

            <th>Fecha</th>

            <th>Unidad</th>

            <th>Iniciales</th>

            <th>Medicamento</th>

            <th>SRAM</th>

            <th>Gravedad</th>

            <th>Acciones</th>

          </tr>

        </thead>


        <tbody id="rows"></tbody>

      </table>

    </div>

  </section>

</div>


<!-- MODAL DETALLE -->

<div
  id="detailModal"
  hidden
  style="
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.60);
    z-index:9999;
    padding:20px;
    overflow:auto;
  "
>

  <div
    class="card"
    style="
      max-width:1000px;
      margin:20px auto;
      max-height:92vh;
      overflow:auto;
    "
  >

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:15px;
      "
    >

      <h2>
        Detalle del reporte SRAM
      </h2>


      <div>

        <button
          class="primary"
          id="printDetail"
          type="button"
        >
          🖨️ Imprimir reporte
        </button>


        <button
          class="secondary"
          id="closeDetail"
          type="button"
        >
          Cerrar
        </button>

      </div>

    </div>


    <hr>


    <div id="detailContent"></div>

  </div>

</div>


<script src="admin.js"></script>

</body>
</html>
