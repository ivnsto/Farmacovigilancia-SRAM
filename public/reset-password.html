<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Restablecer contraseña - Farmacovigilancia SRAM</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

<div class="wrap">

  <!-- ENCABEZADO INSTITUCIONAL -->

  <section class="card institutional-header">

    <div class="institutional-head">

      <div class="institutional-title">

        <div class="imss-name">
          INSTITUTO MEXICANO DEL SEGURO SOCIAL
        </div>

        <div class="pharmacovigilance-name">
          CENTRO INSTITUCIONAL COORDINADOR DE FARMACOVIGILANCIA
        </div>

        <div class="form-title">
          ADMINISTRACIÓN DE FARMACOVIGILANCIA SRAM
        </div>

      </div>

      <div class="imss-logo-container">

        <img
          src="imss-logo.png"
          alt="Instituto Mexicano del Seguro Social"
          class="imss-logo"
        >

      </div>

    </div>

  </section>


  <!-- RESTABLECIMIENTO -->

  <section class="card">

    <h1>🔐 Restablecer contraseña</h1>

    <p class="note">
      Ingresa una nueva contraseña para tu cuenta de administración.
    </p>


    <form id="resetForm">

      <div class="field">

        <label for="newPassword">
          Nueva contraseña
        </label>

        <input
          type="password"
          id="newPassword"
          minlength="8"
          required
          autocomplete="new-password"
          placeholder="Nueva contraseña"
        >

        <span class="small">
          La contraseña debe tener al menos 8 caracteres.
        </span>

      </div>


      <div class="field">

        <label for="confirmPassword">
          Confirmar nueva contraseña
        </label>

        <input
          type="password"
          id="confirmPassword"
          minlength="8"
          required
          autocomplete="new-password"
          placeholder="Confirmar contraseña"
        >

      </div>


      <div class="actions">

        <button
          class="primary"
          type="submit"
          id="savePassword"
        >
          💾 Guardar nueva contraseña
        </button>

      </div>


      <p
        id="resetMsg"
        class="status"
      ></p>

    </form>

  </section>

</div>


<script>

  const resetForm =
    document.getElementById("resetForm");

  const newPassword =
    document.getElementById("newPassword");

  const confirmPassword =
    document.getElementById("confirmPassword");

  const resetMsg =
    document.getElementById("resetMsg");

  const savePassword =
    document.getElementById("savePassword");


  // ===================================================
  // COMPROBAR SESIÓN DE RECUPERACIÓN
  // ===================================================

  let recoverySession = false;


  supabase.auth.onAuthStateChange(
    async (event, session) => {

      console.log(
        "Evento de autenticación:",
        event
      );


      if (event === "PASSWORD_RECOVERY") {

        recoverySession = true;

        resetMsg.textContent =
          "Puedes establecer tu nueva contraseña.";

        return;
      }


      if (
        event === "SIGNED_IN" &&
        session &&
        !recoverySession
      ) {

        // No hacemos nada.
        // Esperamos el evento PASSWORD_RECOVERY.

      }

    }
  );


  // ===================================================
  // CAMBIAR CONTRASEÑA
  // ===================================================

  resetForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const password =
        newPassword.value;

      const confirmation =
        confirmPassword.value;


      resetMsg.textContent =
        "";


      // -----------------------------------------------
      // VALIDACIONES
      // -----------------------------------------------

      if (password.length < 8) {

        resetMsg.textContent =
          "La contraseña debe tener al menos 8 caracteres.";

        return;
      }


      if (password !== confirmation) {

        resetMsg.textContent =
          "Las contraseñas no coinciden.";

        return;
      }


      savePassword.disabled = true;

      resetMsg.textContent =
        "Guardando nueva contraseña...";


      // -----------------------------------------------
      // ACTUALIZAR EN SUPABASE
      // -----------------------------------------------

      const {
        error
      } =
        await supabase.auth.updateUser({
          password: password
        });


      if (error) {

        console.error(error);

        resetMsg.textContent =
          "No se pudo cambiar la contraseña: " +
          error.message;

        savePassword.disabled = false;

        return;
      }


      // -----------------------------------------------
      // ÉXITO
      // -----------------------------------------------

      resetMsg.textContent =
        "✅ Contraseña actualizada correctamente.";


      resetMsg.style.color =
        "#14532d";


      savePassword.disabled = true;


      // -----------------------------------------------
      // ACTUALIZAR FECHA DE SEGURIDAD
      // -----------------------------------------------

      const {
        data: {
          user
        }
      } =
        await supabase.auth.getUser();


      if (user) {

        const now =
          new Date().toISOString();


        const {
          error: dateError
        } =
          await supabase
            .from("sram_password_control")
            .upsert({
              user_id: user.id,
              password_changed_at: now,
              updated_at: now
            });


        if (dateError) {

          console.error(
            "Error actualizando fecha:",
            dateError
          );

        }

      }


      // -----------------------------------------------
      // REGRESAR AL ADMINISTRADOR
      // -----------------------------------------------

      setTimeout(
        async () => {

          await supabase.auth.signOut();

          window.location.href =
            "admin.html";

        },
        1800
      );

    }
  );

</script>

</body>
</html>
